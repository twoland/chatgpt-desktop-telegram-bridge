name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop-source
    steps:
      - uses: actions/checkout@v4
      - name: Check source for credentials and private runtime paths
        run: python3 ../tools/check_release.py --root ..
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install project
        run: uv sync --locked --extra dev
      - name: Run tests
        run: uv run --no-sync pytest
